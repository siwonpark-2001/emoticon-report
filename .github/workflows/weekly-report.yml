name: 주간 이모티콘 트렌드 리포트

on:
  schedule:
    # 매주 월요일 오전 9시 KST (UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  generate-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4 lxml

      - name: 리포트 생성
        run: python main.py --no-browser

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ index.html
          git diff --staged --quiet || git commit -m "리포트 자동 업데이트: $(date +'%Y-%m-%d') (KST)"
          git push
