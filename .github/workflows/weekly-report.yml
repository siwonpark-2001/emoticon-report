name: 주간 이모티콘 트렌드 리포트

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 리포트 생성 및 Lark 알림
        env:
          KAKAO_KAU: ${{ secrets.KAKAO_KAU }}
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
        run: python main.py --no-browser
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ index.html data/
          git diff --staged --quiet || git commit -m "리포트 자동 업데이트: $(date +'%Y-%m-%d') (KST)"
          git push
